name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codec:
    name: Host codec test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++17 -Wall -Wextra -Werror -Imain -o test_codec test/test_codec.cpp && ./test_codec

  firmware:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [esp32c6]
    steps:
      - uses: actions/checkout@v4

      - name: Restore component cache
        uses: actions/cache@v4
        with:
          path: managed_components
          key: components-${{ hashFiles('main/idf_component.yml') }}

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.target }}-${{ hashFiles('main/**', 'sdkconfig.defaults', 'partitions.csv', 'CMakeLists.txt') }}
          restore-keys: |
            ccache-${{ matrix.target }}-

      - name: Compile firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.6
          target: ${{ matrix.target }}
          path: "."
          command: export IDF_CCACHE_ENABLE=1 CCACHE_DIR="$PWD/.ccache" && mkdir -p "$CCACHE_DIR" && idf.py build

      - name: Record image size
        run: |
          python3 - << 'PY'
          import os
          path = "build/zb_panasonic_ac.bin"
          size = os.path.getsize(path)
          limit = 0xA0000
          print(f"{path}: {size} bytes; OTA slot {limit}; margin {limit - size}")
          if size >= limit:
              raise SystemExit("app image does not fit the OTA partition")
          PY

      - name: Collect flash files
        run: |
          target="${{ matrix.target }}"
          mkdir -p "dist/${target}"
          cp build/zb_panasonic_ac.bin "dist/${target}/zb_panasonic_ac_${target}.bin"
          cp build/bootloader/bootloader.bin "dist/${target}/bootloader_${target}.bin"
          cp build/partition_table/partition-table.bin "dist/${target}/partition-table_${target}.bin"
          cp build/flasher_args.json "dist/${target}/flasher_args_${target}.json"
          if [ -f build/flash_args ]; then cp build/flash_args "dist/${target}/flash_args_${target}"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}
          path: dist/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release images
    needs: firmware
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-esp32*
          path: release
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find release -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no firmware files found"
            exit 1
          fi
          notes="ESP-IDF 5.5.6, esp-zigbee-lib 1.6.8, esp-zboss-lib 1.6.4. The images compiled and linked. They were not flashed or tested against an air conditioner."
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "$GITHUB_REF_NAME" --notes "$notes"
          fi
